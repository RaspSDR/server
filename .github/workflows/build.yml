name: Server Build
on: [push, pull_request]

jobs:
  native-host-verification:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libconfig++-dev \
            libfftw3-dev zlib1g-dev libfdk-aac-dev libgps-dev libunwind-dev \
            libsqlite3-dev libcurl4-openssl-dev libssl-dev libcrypt-dev minify

      - name: Install native test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build and verify native host harness
        run: npm run test:regression

  production-source-release-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libconfig++-dev \
            libfftw3-dev zlib1g-dev libfdk-aac-dev libgps-dev libunwind-dev \
            libsqlite3-dev libcurl4-openssl-dev libssl-dev libcrypt-dev minify

      - name: Build production sources in Release mode
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DENABLE_HDFL=OFF
          cmake --build build --parallel
